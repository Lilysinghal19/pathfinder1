<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Career Coach — Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<!--
  LiveKit JS SDK v2 — UMD build.
  Exposes everything as: window.LivekitClient
  CORRECT usage : new LivekitClient.Room(...)
  WRONG usage   : new Room(...)   ← causes "Room is not a constructor"
-->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.9.4/dist/livekit-client.umd.min.js"
        crossorigin="anonymous"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0d1117;--ink2:#161b22;--ink3:#1c2330;--border:#30363d;
  --lime:#39d353;--sky:#58a6ff;--purple:#8b5cf6;--amber:#f59e0b;--red:#f85149;
  --text:#e6edf3;--muted:#8b949e;
}
body{background:var(--ink);color:var(--text);font-family:'Space Grotesk',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 12px 160px}

/* HEADER */
header{width:100%;max-width:700px;padding:20px 0 14px;display:flex;align-items:center;
  gap:12px;border-bottom:1px solid var(--border);margin-bottom:16px}
.orb{width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(var(--lime),var(--sky),var(--purple),var(--lime));
  display:flex;align-items:center;justify-content:center;font-size:18px;
  animation:hue 7s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
header h1{font-size:17px;font-weight:700;letter-spacing:-.3px}
header small{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;display:block;margin-top:2px}
#cbadge{margin-left:auto;display:flex;align-items:center;gap:6px;
  font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted)}
#cdot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .3s}
#cdot.connecting{background:var(--amber);animation:blink 1s infinite}
#cdot.connected{background:var(--lime)}
#cdot.error{background:var(--red)}
@keyframes blink{50%{opacity:.3}}

/* CARD */
.card{width:100%;max-width:700px;background:var(--ink2);border:1px solid var(--border);
  border-radius:20px;overflow:hidden;margin-bottom:12px}

/* AGENT PANEL */
#ap{padding:28px 24px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;
  border-bottom:1px solid var(--border);
  background:radial-gradient(ellipse at 50% 0%,rgba(88,166,255,.07) 0%,transparent 70%)}
#orb{position:relative;width:88px;height:88px}
#orb-inner{width:100%;height:100%;border-radius:50%;
  background:linear-gradient(135deg,#0d2235,#1a3a5c);
  border:2px solid rgba(88,166,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:38px;
  transition:border-color .3s,box-shadow .3s}
#orb.speaking #orb-inner{border-color:rgba(88,166,255,.9);
  box-shadow:0 0 0 8px rgba(88,166,255,.12),0 0 44px rgba(88,166,255,.3);
  animation:breathe 1.8s ease-in-out infinite}
#orb.listening #orb-inner{border-color:rgba(57,211,83,.7);box-shadow:0 0 0 6px rgba(57,211,83,.1)}
#orb.thinking  #orb-inner{border-color:rgba(139,92,246,.7);animation:hue 2s linear infinite}
@keyframes breathe{50%{transform:scale(1.07)}}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(88,166,255,.4);
  opacity:0;pointer-events:none}
#orb.speaking .ring:nth-child(1){animation:ro 2.1s ease-out infinite}
#orb.speaking .ring:nth-child(2){animation:ro 2.1s ease-out .7s infinite}
#orb.speaking .ring:nth-child(3){animation:ro 2.1s ease-out 1.4s infinite}
@keyframes ro{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.3);opacity:0}}
#alabel{font-size:12px;font-weight:600;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
#astate{font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--muted);min-height:18px;transition:color .3s}
#astate.speaking{color:var(--sky)}
#astate.listening{color:var(--lime)}
#astate.thinking{color:var(--purple)}
#micbars{display:flex;align-items:center;gap:3px;height:24px;opacity:0;transition:opacity .3s}
#micbars.show{opacity:1}
#micbars span{display:inline-block;width:3px;border-radius:2px;background:var(--lime);height:4px;transition:height .07s}

/* TRANSCRIPT */
#tx{max-height:280px;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
#tx::-webkit-scrollbar{width:4px}
#tx::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.turn{display:flex;gap:10px;animation:fi .22s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.turn.user{flex-direction:row-reverse}
.av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:3px}
.turn.user .av{background:#2d1f5e}
.turn.agent .av{background:#0d2235;border:1px solid rgba(88,166,255,.3)}
.bub{max-width:76%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.65}
.turn.user  .bub{background:#1e1b3a;border:1px solid rgba(139,92,246,.3);border-radius:16px 4px 16px 16px;color:#c4b5fd}
.turn.agent .bub{background:#0d2235;border:1px solid rgba(88,166,255,.2);border-radius:4px 16px 16px 16px;color:#93c5fd}
.sys{text-align:center;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;padding:3px 0}
#empty{padding:36px 20px;text-align:center;color:var(--muted)}
#empty .ic{font-size:44px;margin-bottom:10px}
#empty p{font-size:13px;line-height:1.75;max-width:300px;margin:0 auto}

/* DEBUG */
#dbcard{width:100%;max-width:700px;background:#0a0f14;border:1px solid #1e2d1e;
  border-radius:14px;margin-bottom:12px;overflow:hidden}
#dbhdr{padding:7px 14px;background:#0f1e0f;border-bottom:1px solid #1e2d1e;
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;font-family:'JetBrains Mono',monospace;color:#4caf50}
#dblog{max-height:170px;overflow-y:auto;padding:8px 12px;
  font-size:11px;font-family:'JetBrains Mono',monospace;line-height:1.7;color:#7ec87e}
#dblog::-webkit-scrollbar{width:3px}
#dblog::-webkit-scrollbar-thumb{background:#1e2d1e}
.dl{padding:1px 0}
.dl.err{color:var(--red)}
.dl.warn{color:var(--amber)}
.dl.ok{color:var(--lime)}
.dl.info{color:var(--sky)}
#clrdbg{background:transparent;border:1px solid #1e2d1e;color:#4caf50;
  font-size:10px;font-family:'JetBrains Mono',monospace;padding:2px 10px;
  border-radius:8px;cursor:pointer}

/* CONTROLS */
#ctrl{width:100%;max-width:700px;position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  padding:12px 14px 22px;background:linear-gradient(to top,var(--ink) 74%,transparent);
  display:flex;align-items:center;justify-content:center;gap:12px;z-index:20}
#callbtn{width:68px;height:68px;border-radius:50%;border:none;cursor:pointer;font-size:26px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
#callbtn.idle{background:linear-gradient(135deg,var(--lime),#16a34a);color:#000;
  box-shadow:0 4px 24px rgba(57,211,83,.4)}
#callbtn.idle:hover{transform:scale(1.08)}
#callbtn.active{background:linear-gradient(135deg,var(--red),#9b1c1c);color:#fff;
  animation:cp 2s infinite}
@keyframes cp{50%{box-shadow:0 4px 40px rgba(248,81,73,.7)}}
#callbtn:disabled{opacity:.35;cursor:default;transform:none;animation:none}
#mutebtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);
  background:var(--ink3);color:var(--text);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
  opacity:0;pointer-events:none}
#mutebtn.show{opacity:1;pointer-events:auto}
#mutebtn.muted{border-color:var(--red);color:var(--red);background:#1f0f0f}
.meta{display:flex;flex-direction:column;align-items:center;gap:6px}
.hint{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted);text-align:center}
#volrow{display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .3s}
#volrow.show{opacity:1;pointer-events:auto}
#volsl{-webkit-appearance:none;width:90px;height:4px;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
#volsl::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--sky);cursor:pointer}
.vl{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--muted);min-width:32px}
</style>
</head>
<body>

<header>
  <div class="orb">🎙</div>
  <div>
    <h1>AI Career Coach</h1>
    <small>WebRTC · Google STT · Gemini 2.5 Flash · Google TTS</small>
  </div>
  <div id="cbadge"><div id="cdot"></div><span id="ctxt">idle</span></div>
</header>

<div class="card">
  <div id="ap">
    <div id="orb">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div id="orb-inner">🤖</div>
    </div>
    <div id="alabel">Career Coach</div>
    <div id="astate">Press the green button to start</div>
    <div id="micbars">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
  </div>
  <div id="tx">
    <div id="empty">
      <div class="ic">🎤</div>
      <p>Click the green button.<br/>Speak naturally — no push-to-talk.<br/>Interrupt the agent any time.</p>
    </div>
  </div>
</div>

<div id="dbcard">
  <div id="dbhdr">
    <span>🔍 debug log</span>
    <button id="clrdbg" onclick="document.getElementById('dblog').innerHTML=''">clear</button>
  </div>
  <div id="dblog"></div>
</div>

<div id="ctrl">
  <button id="mutebtn">🎤</button>
  <div class="meta">
    <div style="display:flex;align-items:center;gap:12px">
      <button id="callbtn" class="idle">📞</button>
    </div>
    <div class="hint" id="callhint">Tap to start a voice session</div>
    <div id="volrow">
      <span style="font-size:14px">🔊</span>
      <input id="volsl" type="range" min="0" max="1" step="0.05" value="0.9"/>
      <span class="vl" id="vll">90%</span>
    </div>
  </div>
</div>

<audio id="aud" autoplay playsinline></audio>

<script>
// ══════════════════════════════════════════════
// DEBUG LOGGER
// ══════════════════════════════════════════════
const dblog = document.getElementById('dblog');
function dl(msg, type='') {
  const t = new Date().toTimeString().slice(0,8);
  const d = document.createElement('div');
  d.className = 'dl ' + type;
  d.textContent = `[${t}] ${msg}`;
  dblog.appendChild(d);
  dblog.scrollTop = dblog.scrollHeight;
  console[type==='err'?'error':type==='warn'?'warn':'log'](`[${t}] ${msg}`);
}

// ══════════════════════════════════════════════
// SDK CHECK — runs immediately
// ══════════════════════════════════════════════
dl('Page loaded — checking LiveKit SDK…');

if (typeof window.LivekitClient === 'undefined') {
  dl('FATAL: window.LivekitClient is undefined', 'err');
  dl('The CDN script did not load. Check Network tab.', 'warn');
} else {
  const v = LivekitClient.version || 'unknown';
  dl(`SDK loaded ✓  v${v}`, 'ok');
  if (typeof LivekitClient.Room !== 'function') {
    dl('FATAL: LivekitClient.Room is not a function', 'err');
  } else {
    dl('LivekitClient.Room constructor ✓', 'ok');
  }
}

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let room = null, isMuted = false, isConn = false;
let agentP = null, micAn = null, rafId = null;

const AUD      = document.getElementById('aud');
const callbtn  = document.getElementById('callbtn');
const mutebtn  = document.getElementById('mutebtn');
const volsl    = document.getElementById('volsl');
const vll      = document.getElementById('vll');
const volrow   = document.getElementById('volrow');
const orbEl    = document.getElementById('orb');
const astate   = document.getElementById('astate');
const tx       = document.getElementById('tx');
const cdot     = document.getElementById('cdot');
const ctxt     = document.getElementById('ctxt');
const micbars  = document.getElementById('micbars');
const bars     = micbars.querySelectorAll('span');
const callhint = document.getElementById('callhint');

// ══════════════════════════════════════════════
// AUDIO UNLOCK  (Chrome autoplay policy)
// ══════════════════════════════════════════════
let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  const ac = new AudioContext();
  ac.resume().then(() => { dl('AudioContext unlocked ✓','ok'); ac.close(); });
  if (AUD.srcObject) AUD.play().catch(()=>{});
}
document.addEventListener('click', unlockAudio);

// ══════════════════════════════════════════════
// START CALL
// ══════════════════════════════════════════════
async function startCall() {
  // Guard: SDK must be loaded before we try anything
  if (typeof LivekitClient === 'undefined' || typeof LivekitClient.Room !== 'function') {
    dl('Cannot start — LiveKit SDK not loaded', 'err');
    return;
  }
  unlockAudio();
  setConn('connecting','⟳ connecting…');
  callbtn.disabled = true;
  callhint.textContent = 'Fetching token…';

  // 1. Get token
  let td;
  try {
    dl('Fetching /token…');
    const r = await fetch('/token');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    td = await r.json();
    dl(`Token OK — room:${td.room} identity:${td.identity}`, 'ok');
    dl('Server URL: ' + td.serverUrl);
  } catch(e) {
    dl('Token FAILED: ' + e.message, 'err');
    setConn('error','● error');
    callbtn.disabled = false;
    callhint.textContent = 'Token error — is token_server.py running?';
    return;
  }

  // 2. Create Room using LivekitClient namespace
  dl('Creating LivekitClient.Room…');
  try {
    room = new LivekitClient.Room({
      adaptiveStream: true,
      dynacast:       true,
      audioCaptureDefaults: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl:  true,
        sampleRate:       16000,
        channelCount:     1,
      },
    });
    dl('Room object created ✓', 'ok');
  } catch(e) {
    dl('Room creation FAILED: ' + e.message, 'err');
    callbtn.disabled = false;
    return;
  }

  // 3. Register ALL events BEFORE connect()
  const E = LivekitClient.RoomEvent;
  room.on(E.Connected,               onConnected);
  room.on(E.Disconnected,            onDisconnected);
  room.on(E.Reconnecting,            ()=>{ dl('Reconnecting…','warn'); setConn('connecting','⟳ reconnecting…') });
  room.on(E.Reconnected,             ()=>{ dl('Reconnected ✓','ok');   setConn('connected','● live') });
  room.on(E.ParticipantConnected,    onParticipantIn);
  room.on(E.ParticipantDisconnected, onParticipantOut);
  room.on(E.TrackSubscribed,         onTrackSub);
  room.on(E.TrackUnsubscribed,       onTrackUnsub);
  room.on(E.TrackPublished,          (p,par)=>dl(`TrackPublished by ${par.identity}: ${p.kind}`));
  room.on(E.ActiveSpeakersChanged,   onSpeakers);
  room.on(E.DataReceived,            onData);
  room.on(E.MediaDevicesError,       e=>dl('MediaDevices error: '+e.message,'err'));
  dl('Events registered ✓','ok');

  // 4. Connect — autoSubscribe:true is CRITICAL for agent audio
  dl('Connecting to ' + td.serverUrl + '…');
  try {
    await room.connect(td.serverUrl, td.token, { autoSubscribe: true });
    dl('room.connect() resolved ✓','ok');
  } catch(e) {
    dl('Connect FAILED: ' + e.message, 'err');
    dl('Check: LIVEKIT_URL in .env must be wss:// not http://', 'warn');
    setConn('error','● error');
    callbtn.disabled = false;
    callhint.textContent = 'Connect failed — see debug log';
    return;
  }
}

async function endCall() {
  dl('Ending call…');
  if (room) await room.disconnect();
  cleanup();
}

function cleanup() {
  isConn = false; agentP = null;
  stopMicViz();
  AUD.srcObject = null; AUD.src = '';
  callbtn.className='idle'; callbtn.textContent='📞'; callbtn.disabled=false;
  mutebtn.classList.remove('show');
  volrow.classList.remove('show');
  micbars.classList.remove('show');
  setState('idle','Press the green button to start');
  setConn('','idle');
  callhint.textContent='Tap to start a voice session';
}

// ══════════════════════════════════════════════
// ROOM EVENTS
// ══════════════════════════════════════════════
async function onConnected() {
  isConn = true;
  dl('Room connected ✓  local=' + room.localParticipant.identity,'ok');
  dl('Remote participants already present: ' + room.remoteParticipants.size);
  setConn('connected','● live');
  callbtn.className='active'; callbtn.textContent='📵'; callbtn.disabled=false;
  mutebtn.classList.add('show');
  volrow.classList.add('show');
  callhint.textContent='Speak naturally — no buttons needed';
  sys('🟢 Call connected');

  // Publish mic
  dl('Enabling microphone…');
  try {
    await room.localParticipant.setMicrophoneEnabled(true);
    dl('Microphone enabled ✓','ok');
    const pubs = [...room.localParticipant.audioTrackPublications.values()];
    if (pubs.length && pubs[0].track) startMicViz(pubs[0].track.mediaStreamTrack);
  } catch(e) {
    dl('Mic failed: ' + e.message,'err');
    dl('→ Allow mic in browser address bar','warn');
    dl('→ Windows: Settings > Privacy > Microphone','warn');
  }

  setState('listening','● waiting for agent…');

  // Handle already-present participants (agent may have joined first)
  for (const [,p] of room.remoteParticipants) {
    dl('Pre-existing participant: ' + p.identity + ' isAgent=' + isAgent(p));
    if (isAgent(p)) {
      agentP = p;
      sys('🤖 Agent already in room');
      setState('listening','👂 listening…');
      // Attach any already-subscribed tracks
      for (const [,pub] of p.audioTrackPublications) {
        dl(`Pre-existing audio track: subscribed=${pub.isSubscribed} hasTrack=${!!pub.track}`);
        if (pub.track) attachAudio(pub.track);
      }
    }
  }
}

function onDisconnected(reason) {
  dl('Disconnected: ' + (reason||'unknown'),'warn');
  sys('🔴 Call ended' + (reason?` (${reason})`:''));
  cleanup();
}

function onParticipantIn(p) {
  dl('Participant joined: ' + p.identity + ' isAgent=' + isAgent(p));
  if (isAgent(p)) {
    agentP = p;
    dl('Agent joined ✓','ok');
    sys('🤖 Agent joined');
    setState('listening','👂 listening…');
  }
}

function onParticipantOut(p) {
  dl('Participant left: ' + p.identity,'warn');
  if (p === agentP) { agentP=null; sys('⚠ Agent left'); setState('idle','⚠ Agent disconnected'); }
}

// ══════════════════════════════════════════════
// TRACK SUBSCRIBED — attach agent audio here
// ══════════════════════════════════════════════
function onTrackSub(track, pub, participant) {
  dl(`TrackSubscribed: ${participant.identity} kind=${track.kind} muted=${track.isMuted}`);
  if (track.kind === LivekitClient.Track.Kind.Audio) {
    if (isAgent(participant)) {
      dl('→ Agent audio track — attaching to <audio>','ok');
      attachAudio(track);
    } else {
      dl('→ Audio from non-agent: ' + participant.identity);
    }
  }
}

function onTrackUnsub(track, pub, participant) {
  dl('TrackUnsubscribed: ' + participant.identity + ' kind=' + track.kind);
  if (track.kind === LivekitClient.Track.Kind.Audio && isAgent(participant)) {
    AUD.srcObject = null;
    dl('Agent audio track removed');
  }
}

// ══════════════════════════════════════════════
// ATTACH AUDIO — robust with autoplay retry
// ══════════════════════════════════════════════
function attachAudio(track) {
  dl('Attaching audio track…');
  try {
    AUD.srcObject = new MediaStream([track.mediaStreamTrack]);
    AUD.volume    = parseFloat(volsl.value);
    AUD.muted     = false;
    AUD.play()
      .then(()=> dl('Agent audio playing ✓','ok'))
      .catch(e => {
        dl('Autoplay blocked: ' + e.message,'warn');
        dl('→ Click anywhere on the page to unlock audio','warn');
        // Retry on next user click
        document.addEventListener('click', ()=>{
          AUD.play().catch(()=>{});
        }, {once:true});
      });
  } catch(e) {
    dl('attachAudio error: ' + e.message,'err');
  }
}

// ══════════════════════════════════════════════
// ACTIVE SPEAKERS
// ══════════════════════════════════════════════
function onSpeakers(speakers) {
  if (!isConn) return;
  const agentTalk = agentP && speakers.some(p=>p===agentP);
  const userTalk  = speakers.some(p=>p===room.localParticipant);
  if      (agentTalk) setState('speaking','🔊 speaking…');
  else if (userTalk)  setState('listening','👂 listening…');
  else                setState('listening','● listening…');
}

// ══════════════════════════════════════════════
// DATA CHANNEL (transcript from agent)
// ══════════════════════════════════════════════
function onData(payload, participant) {
  try {
    const msg = JSON.parse(new TextDecoder().decode(payload));
    dl('Data: type='+msg.type+' from='+(participant?.identity||'server'));
    if (msg.type==='transcript') {
      document.querySelector(`.turn.partial.${msg.role}`)?.remove();
      addTurn(msg.role, msg.text, !msg.final);
    }
    if (msg.type==='agent_state') {
      const m={listening:['listening','👂 listening…'],thinking:['thinking','🧠 thinking…'],
               speaking:['speaking','🔊 speaking…'],transcribing:['thinking','✍ transcribing…']};
      const [cls,lbl]=m[msg.state]||['listening','● listening…'];
      setState(cls,lbl);
    }
  } catch(e){ dl('Data parse error: '+e.message,'warn'); }
}

// ══════════════════════════════════════════════
// MIC VISUALISER
// ══════════════════════════════════════════════
function startMicViz(mst) {
  try {
    const ctx=new AudioContext(), src=ctx.createMediaStreamSource(new MediaStream([mst]));
    micAn=ctx.createAnalyser(); micAn.fftSize=64; src.connect(micAn);
    micbars.classList.add('show');
    const buf=new Uint8Array(micAn.frequencyBinCount);
    (function draw(){ micAn.getByteFrequencyData(buf);
      bars.forEach((b,i)=>{ b.style.height=Math.max(3,(buf[i*2]/255)*22)+'px'; });
      rafId=requestAnimationFrame(draw);
    })();
  } catch(e){ dl('Mic viz error: '+e.message,'warn'); }
}
function stopMicViz() {
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  bars.forEach(b=>b.style.height='4px');
  micbars.classList.remove('show');
}

// ══════════════════════════════════════════════
// UI HELPERS
// ══════════════════════════════════════════════
function setState(cls,lbl){ orbEl.className=cls; astate.className=cls; astate.textContent=lbl; }
function setConn(cls,lbl){ cdot.className=cls; ctxt.textContent=lbl; }
function addTurn(role,text,partial=false) {
  document.getElementById('empty')?.remove();
  const d=document.createElement('div'); d.className=`turn ${role}${partial?' partial':''}`;
  const av=document.createElement('div'); av.className='av'; av.textContent=role==='user'?'👤':'🤖';
  const b=document.createElement('div'); b.className='bub'; b.textContent=text;
  d.appendChild(av); d.appendChild(b); tx.appendChild(d); tx.scrollTop=tx.scrollHeight;
}
function sys(t) {
  const d=document.createElement('div'); d.className='sys'; d.textContent=t;
  tx.appendChild(d); tx.scrollTop=tx.scrollHeight;
}

// ══════════════════════════════════════════════
// AGENT IDENTITY DETECTION
// LiveKit agents can have various identity patterns
// ══════════════════════════════════════════════
function isAgent(p) {
  if (!p) return false;
  const id=(p.identity||'').toLowerCase();
  const nm=(p.name||'').toLowerCase();
  return (
    id==='agent' || id.startsWith('agent-') || id.startsWith('lk-agent') ||
    nm.includes('agent') ||
    (typeof LivekitClient.ParticipantKind !== 'undefined' &&
     p.kind === LivekitClient.ParticipantKind.AGENT) ||
    (p.attributes && p.attributes['lk.agent']==='true')
  );
}

// ══════════════════════════════════════════════
// EVENT LISTENERS
// ══════════════════════════════════════════════
callbtn.addEventListener('click',()=>{ if(!isConn) startCall(); else endCall(); });

mutebtn.addEventListener('click',()=>{
  if(!room) return;
  isMuted=!isMuted;
  room.localParticipant.setMicrophoneEnabled(!isMuted);
  mutebtn.textContent=isMuted?'🔇':'🎤';
  mutebtn.classList.toggle('muted',isMuted);
  callhint.textContent=isMuted?'🔇 Muted':'Speak naturally — no buttons needed';
  dl('Mic '+(isMuted?'MUTED':'UNMUTED'));
});

volsl.addEventListener('input',()=>{
  AUD.volume=parseFloat(volsl.value);
  vll.textContent=Math.round(volsl.value*100)+'%';
});

// Final check after all scripts load
window.addEventListener('load',()=>{
  if (typeof LivekitClient==='undefined') {
    dl('SDK STILL undefined after window.load','err');
    callbtn.disabled=true;
    callhint.textContent='⚠ SDK failed to load — check Network tab';
  } else {
    dl('Ready — click the green button to start','ok');
  }
});
</script>
