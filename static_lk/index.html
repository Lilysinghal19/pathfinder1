<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Career Coach — Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<!-- LiveKit Browser SDK — official CDN -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0d1117; --ink2:#161b22; --ink3:#1c2330;
  --border:#30363d;
  --lime:#39d353; --sky:#58a6ff; --purple:#8b5cf6;
  --amber:#f59e0b; --red:#f85149;
  --text:#e6edf3; --muted:#8b949e;
}
body{
  background:var(--ink); color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; padding:0 16px 130px;
}

/* ── HEADER ── */
header{
  width:100%; max-width:660px;
  padding:24px 0 16px;
  display:flex; align-items:center; gap:12px;
  border-bottom:1px solid var(--border); margin-bottom:20px;
}
.hdr-orb{
  width:38px; height:38px; border-radius:50%; flex-shrink:0;
  background:conic-gradient(var(--lime),var(--sky),var(--purple),var(--lime));
  display:flex; align-items:center; justify-content:center; font-size:18px;
  animation:hue 7s linear infinite;
}
@keyframes hue{to{filter:hue-rotate(360deg)}}
header h1{font-size:18px; font-weight:700; letter-spacing:-.3px}
header small{font-size:11px; color:var(--muted); font-family:'JetBrains Mono',monospace; display:block; margin-top:2px}
#conn-status{
  margin-left:auto; display:flex; align-items:center; gap:6px;
  font-size:11px; font-family:'JetBrains Mono',monospace; color:var(--muted);
}
#conn-dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--border); transition:background .3s;
}
#conn-dot.connecting{background:var(--amber); animation:blink 1s infinite}
#conn-dot.connected{background:var(--lime)}
#conn-dot.error{background:var(--red)}
@keyframes blink{50%{opacity:.3}}

/* ── MAIN CARD ── */
.card{
  width:100%; max-width:660px;
  background:var(--ink2); border:1px solid var(--border);
  border-radius:20px; overflow:hidden; margin-bottom:16px;
}

/* ── AGENT VISUALIZER ── */
#agent-panel{
  padding:30px 24px 22px;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  border-bottom:1px solid var(--border);
  background:radial-gradient(ellipse at 50% 0%, rgba(88,166,255,.07) 0%, transparent 70%);
}
#agent-orb{position:relative; width:90px; height:90px;}
#agent-orb-inner{
  width:100%; height:100%; border-radius:50%;
  background:linear-gradient(135deg,#0d2235,#1a3a5c);
  border:2px solid rgba(88,166,255,.2);
  display:flex; align-items:center; justify-content:center; font-size:38px;
  transition:border-color .3s, box-shadow .3s;
}
#agent-orb.speaking #agent-orb-inner{
  border-color:rgba(88,166,255,.9);
  box-shadow:0 0 0 8px rgba(88,166,255,.12), 0 0 44px rgba(88,166,255,.3);
  animation:breathe 1.8s ease-in-out infinite;
}
#agent-orb.listening #agent-orb-inner{
  border-color:rgba(57,211,83,.7);
  box-shadow:0 0 0 6px rgba(57,211,83,.1);
}
#agent-orb.thinking #agent-orb-inner{
  border-color:rgba(139,92,246,.7);
  box-shadow:0 0 0 6px rgba(139,92,246,.1);
  animation:think-spin 2s linear infinite;
}
@keyframes breathe{50%{transform:scale(1.07)}}
@keyframes think-spin{to{filter:hue-rotate(360deg)}}
.ring{
  position:absolute; inset:0; border-radius:50%;
  border:2px solid rgba(88,166,255,.4);
  opacity:0; pointer-events:none;
}
#agent-orb.speaking .ring:nth-child(1){animation:ring-out 2.1s ease-out infinite}
#agent-orb.speaking .ring:nth-child(2){animation:ring-out 2.1s ease-out .7s infinite}
#agent-orb.speaking .ring:nth-child(3){animation:ring-out 2.1s ease-out 1.4s infinite}
@keyframes ring-out{0%{transform:scale(1);opacity:.55} 100%{transform:scale(2.3);opacity:0}}

#agent-label{font-size:13px; font-weight:600; letter-spacing:.5px; color:var(--muted); text-transform:uppercase}
#agent-state-text{
  font-size:13px; font-family:'JetBrains Mono',monospace; color:var(--muted);
  min-height:18px; transition:color .3s;
}
#agent-state-text.speaking{color:var(--sky)}
#agent-state-text.listening{color:var(--lime)}
#agent-state-text.thinking{color:var(--purple)}

/* Mic bars */
#mic-level-wrap{
  display:flex; align-items:center; gap:3px; height:24px;
  opacity:0; transition:opacity .3s;
}
#mic-level-wrap.active{opacity:1}
#mic-level-wrap span{
  display:inline-block; width:3px; border-radius:2px;
  background:var(--lime); height:4px; transition:height .07s;
}

/* ── TRANSCRIPT ── */
#transcript-area{
  max-height:340px; overflow-y:auto;
  padding:16px 20px;
  display:flex; flex-direction:column; gap:10px;
  scroll-behavior:smooth;
}
#transcript-area::-webkit-scrollbar{width:4px}
#transcript-area::-webkit-scrollbar-thumb{background:var(--border); border-radius:2px}

.turn{display:flex; gap:10px; animation:fadein .22s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none}}
.turn.user{flex-direction:row-reverse}
.avatar{
  width:28px; height:28px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:12px; margin-top:3px;
}
.turn.user  .avatar{background:#2d1f5e}
.turn.agent .avatar{background:#0d2235; border:1px solid rgba(88,166,255,.3)}
.bubble{
  max-width:76%; padding:10px 15px; border-radius:16px;
  font-size:14px; line-height:1.65;
}
.turn.user  .bubble{background:#1e1b3a; border:1px solid rgba(139,92,246,.3); border-radius:16px 4px 16px 16px; color:#c4b5fd}
.turn.agent .bubble{background:#0d2235; border:1px solid rgba(88,166,255,.2); border-radius:4px 16px 16px 16px; color:#93c5fd}
.turn.partial .bubble{opacity:.55; font-style:italic}
.sys-msg{
  text-align:center; font-size:11px; color:var(--muted);
  font-family:'JetBrains Mono',monospace; padding:4px 0;
}
#empty-state{
  padding:44px 20px; text-align:center; color:var(--muted);
}
#empty-state .icon{font-size:44px; margin-bottom:12px}
#empty-state p{font-size:13px; line-height:1.75; max-width:320px; margin:0 auto}

/* ── CONTROLS ── */
#controls{
  width:100%; max-width:660px;
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  padding:14px 16px 24px;
  background:linear-gradient(to top, var(--ink) 72%, transparent);
  display:flex; align-items:center; justify-content:center; gap:14px;
  z-index:20;
}
#call-btn{
  width:70px; height:70px; border-radius:50%; border:none;
  cursor:pointer; font-size:28px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:all .2s; position:relative;
}
#call-btn.idle{
  background:linear-gradient(135deg,var(--lime),#16a34a);
  color:#000; box-shadow:0 4px 24px rgba(57,211,83,.4);
}
#call-btn.idle:hover{transform:scale(1.08); box-shadow:0 6px 32px rgba(57,211,83,.6)}
#call-btn.active{
  background:linear-gradient(135deg,var(--red),#9b1c1c);
  color:#fff; box-shadow:0 4px 24px rgba(248,81,73,.4);
  animation:call-pulse 2s ease-in-out infinite;
}
@keyframes call-pulse{50%{box-shadow:0 4px 40px rgba(248,81,73,.7)}}
#call-btn:disabled{opacity:.35; cursor:default; transform:none; animation:none}

#mute-btn{
  width:46px; height:46px; border-radius:50%;
  border:1px solid var(--border); background:var(--ink3);
  color:var(--text); font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .2s; opacity:0; pointer-events:none;
}
#mute-btn.visible{opacity:1; pointer-events:auto}
#mute-btn.muted{border-color:var(--red); color:var(--red); background:#1f0f0f}

.call-meta{
  display:flex; flex-direction:column; align-items:center; gap:8px;
}
.call-hint{
  font-size:12px; font-family:'JetBrains Mono',monospace;
  color:var(--muted); text-align:center;
}
#vol-wrap{
  display:flex; align-items:center; gap:8px;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
#vol-wrap.visible{opacity:1; pointer-events:auto}
#vol-wrap span{font-size:15px}
#vol-slider{
  -webkit-appearance:none; width:80px; height:4px;
  background:var(--border); border-radius:2px; outline:none; cursor:pointer;
}
#vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none; width:14px; height:14px;
  border-radius:50%; background:var(--sky); cursor:pointer;
}

/* ── TOAST ── */
#toast{
  position:fixed; top:20px; left:50%; transform:translateX(-50%);
  padding:10px 22px; border-radius:24px;
  font-size:13px; font-family:'JetBrains Mono',monospace; font-weight:500;
  z-index:99; opacity:0; transition:opacity .3s; pointer-events:none;
  white-space:nowrap;
}
#toast.show{opacity:1}
#toast.info  {background:#1d2d4a; color:var(--sky);    border:1px solid var(--sky)}
#toast.error {background:#2d1010; color:var(--red);    border:1px solid var(--red)}
#toast.ok    {background:#0f2218; color:var(--lime);   border:1px solid var(--lime)}
</style>
</head>
<body>

<header>
  <div class="hdr-orb">🎙</div>
  <div>
    <h1>AI Career Coach</h1>
    <small>WebRTC · Google STT · Groq LLM · Google TTS</small>
  </div>
  <div id="conn-status">
    <div id="conn-dot"></div>
    <span id="conn-text">idle</span>
  </div>
</header>

<div class="card">
  <!-- Agent orb + state -->
  <div id="agent-panel">
    <div id="agent-orb">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div id="agent-orb-inner">🤖</div>
    </div>
    <div id="agent-label">Career Coach</div>
    <div id="agent-state-text">Press the green button to start</div>
    <div id="mic-level-wrap">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
  </div>

  <!-- Conversation transcript -->
  <div id="transcript-area">
    <div id="empty-state">
      <div class="icon">🎤</div>
      <p>Click the green button to start.<br/>
         Just talk naturally — no buttons needed.<br/>
         You can interrupt the agent at any time.</p>
    </div>
  </div>
</div>

<!-- Bottom controls -->
<div id="controls">
  <button id="mute-btn" title="Mute / Unmute">🎤</button>
  <div class="call-meta">
    <div style="display:flex;align-items:center;gap:14px">
      <button id="call-btn" class="idle" title="Start / End call">📞</button>
    </div>
    <div class="call-hint" id="call-hint">Tap to start a voice session</div>
    <div id="vol-wrap">
      <span>🔊</span>
      <input id="vol-slider" type="range" min="0" max="1" step="0.05" value="1"/>
      <span style="font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace" id="vol-label">100%</span>
    </div>
  </div>
</div>

<div id="toast"></div>
<audio id="agent-audio" autoplay></audio>

<script>
// ══════════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════════
const TOKEN_URL = '/token';   // served by token_server.py on same origin

// ══════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════
let room             = null;
let isMuted          = false;
let isConnected      = false;
let agentParticipant = null;
let micAnalyser      = null;
let micRafId         = null;

// ══════════════════════════════════════════════════════
//  DOM
// ══════════════════════════════════════════════════════
const callBtn        = document.getElementById('call-btn');
const muteBtn        = document.getElementById('mute-btn');
const volSlider      = document.getElementById('vol-slider');
const volLabel       = document.getElementById('vol-label');
const volWrap        = document.getElementById('vol-wrap');
const agentOrb       = document.getElementById('agent-orb');
const agentStateText = document.getElementById('agent-state-text');
const transcriptArea = document.getElementById('transcript-area');
const connDot        = document.getElementById('conn-dot');
const connText       = document.getElementById('conn-text');
const micLevelWrap   = document.getElementById('mic-level-wrap');
const micBars        = micLevelWrap.querySelectorAll('span');
const agentAudio     = document.getElementById('agent-audio');
const callHint       = document.getElementById('call-hint');
const toastEl        = document.getElementById('toast');
let toastTimer       = null;

// ══════════════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════════════
function toast(msg, type='info', ms=3000){
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.className   = `show ${type}`;
  toastTimer = setTimeout(()=>{ toastEl.className=''; }, ms);
}

// ══════════════════════════════════════════════════════
//  CONNECT
// ══════════════════════════════════════════════════════
async function startCall(){
  setConnStatus('connecting','⟳ connecting…');
  callBtn.disabled = true;
  callHint.textContent = 'Connecting to LiveKit…';

  // 1. Get token from our backend
  let td;
  try{
    const r = await fetch(TOKEN_URL);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    td = await r.json();
  }catch(e){
    toast('⚠ Token server error: '+e.message,'error',5000);
    setConnStatus('error','● error');
    callBtn.disabled=false;
    return;
  }

  // 2. Create room with WebRTC best-practices
  room = new LivekitClient.Room({
    adaptiveStream: true,
    dynacast:       true,
    audioCaptureDefaults:{
      echoCancellation:  true,
      noiseSuppression:  true,
      autoGainControl:   true,
      sampleRate:        16000,
      channelCount:      1,
    },
    audioOutput:{ deviceId: 'default' },
  });

  // 3. Events
  room
    .on(LivekitClient.RoomEvent.Connected,              onConnected)
    .on(LivekitClient.RoomEvent.Disconnected,           onDisconnected)
    .on(LivekitClient.RoomEvent.ParticipantConnected,   onParticipantIn)
    .on(LivekitClient.RoomEvent.ParticipantDisconnected,onParticipantOut)
    .on(LivekitClient.RoomEvent.TrackSubscribed,        onTrackSubscribed)
    .on(LivekitClient.RoomEvent.TrackUnsubscribed,      onTrackUnsubscribed)
    .on(LivekitClient.RoomEvent.ActiveSpeakersChanged,  onActiveSpeakers)
    .on(LivekitClient.RoomEvent.DataReceived,           onDataReceived)
    .on(LivekitClient.RoomEvent.ConnectionQualityChanged, onQualityChanged);

  // 4. Connect
  try{
    await room.connect(td.serverUrl, td.token);
  }catch(e){
    toast('⚠ LiveKit connect failed: '+e.message,'error',6000);
    setConnStatus('error','● error');
    callBtn.disabled=false;
    return;
  }
}

async function endCall(){
  if(room){ await room.disconnect(); }
  cleanup();
}

function cleanup(){
  isConnected      = false;
  agentParticipant = null;
  stopMicViz();
  if(agentAudio.srcObject){ agentAudio.srcObject=null; }
  callBtn.className   = 'idle';
  callBtn.textContent = '📞';
  callBtn.disabled    = false;
  muteBtn.classList.remove('visible');
  volWrap.classList.remove('visible');
  micLevelWrap.classList.remove('active');
  setAgentState('idle','Press the green button to start');
  setConnStatus('','idle');
  callHint.textContent = 'Tap to start a voice session';
}

// ══════════════════════════════════════════════════════
//  ROOM EVENTS
// ══════════════════════════════════════════════════════
async function onConnected(){
  isConnected = true;
  setConnStatus('connected','● live');
  callBtn.className   = 'active';
  callBtn.textContent = '📵';
  callBtn.disabled    = false;
  muteBtn.classList.add('visible');
  volWrap.classList.add('visible');
  callHint.textContent = 'Speak naturally — no buttons needed';
  toast('🟢 Connected!','ok',2500);

  // Publish mic
  try{
    await room.localParticipant.setMicrophoneEnabled(true);
    // Start mic visualiser
    const pubs = [...room.localParticipant.audioTrackPublications.values()];
    if(pubs.length && pubs[0].track){
      startMicViz(pubs[0].track.mediaStreamTrack);
    }
  }catch(e){
    toast('⚠ Mic access denied','error',5000);
  }

  setAgentState('listening','● waiting for agent…');
  addSysMsg('🟢 Call connected');

  // Check already-present participants (agent may have joined first)
  for(const p of room.remoteParticipants.values()){
    if(isAgent(p)){ agentParticipant=p; setAgentState('listening','👂 listening…'); }
  }
}

function onDisconnected(reason){
  addSysMsg('🔴 Call ended'+(reason?` (${reason})`:''));
  cleanup();
}

function onParticipantIn(p){
  if(isAgent(p)){
    agentParticipant = p;
    addSysMsg('🤖 Agent joined');
    setAgentState('listening','👂 listening…');
    toast('🤖 Agent ready','ok',2000);
  }
}

function onParticipantOut(p){
  if(p===agentParticipant){
    agentParticipant=null;
    addSysMsg('⚠ Agent disconnected');
    setAgentState('idle','⚠ Agent left');
  }
}

function onTrackSubscribed(track, pub, participant){
  if(track.kind === LivekitClient.Track.Kind.Audio && isAgent(participant)){
    const stream = new MediaStream([track.mediaStreamTrack]);
    agentAudio.srcObject = stream;
    agentAudio.volume    = parseFloat(volSlider.value);
    agentAudio.play().catch(()=>{});
  }
}

function onTrackUnsubscribed(track, pub, participant){
  if(track.kind===LivekitClient.Track.Kind.Audio && isAgent(participant)){
    agentAudio.srcObject=null;
  }
}

function onActiveSpeakers(speakers){
  if(!isConnected) return;
  const agentTalking = agentParticipant && speakers.some(p=>p===agentParticipant);
  const userTalking  = speakers.some(p=>p===room.localParticipant);
  if(agentTalking){
    setAgentState('speaking','🔊 speaking…');
  } else if(userTalking){
    setAgentState('listening','👂 listening…');
  } else {
    setAgentState('listening','● listening…');
  }
}

// Agent sends state + transcript via data channel
function onDataReceived(payload, participant){
  try{
    const msg = JSON.parse(new TextDecoder().decode(payload));
    if(msg.type==='transcript'){
      const old = document.querySelector(`.turn.partial.${msg.role}`);
      if(old) old.remove();
      appendTurn(msg.role, msg.text, !msg.final);
    }
    if(msg.type==='agent_state'){ applyAgentState(msg.state); }
  }catch{}
}

function onQualityChanged(quality, participant){
  if(participant===room.localParticipant){
    const labels={0:'Unknown',1:'Excellent',2:'Good',3:'Poor'};
    if(quality===3) toast('⚠ Poor connection quality','error',4000);
  }
}

// ══════════════════════════════════════════════════════
//  AGENT STATE MAPPING
// ══════════════════════════════════════════════════════
function applyAgentState(state){
  const m={
    listening:  ['listening','👂 listening…'],
    thinking:   ['thinking', '🧠 thinking…'],
    speaking:   ['speaking', '🔊 speaking…'],
    transcribing:['thinking','✍ transcribing…'],
  };
  const [cls,lbl] = m[state]||['listening','● listening…'];
  setAgentState(cls,lbl);
}

// ══════════════════════════════════════════════════════
//  MIC VISUALISER
// ══════════════════════════════════════════════════════
function startMicViz(mst){
  const ctx = new AudioContext();
  const src = ctx.createMediaStreamSource(new MediaStream([mst]));
  micAnalyser = ctx.createAnalyser();
  micAnalyser.fftSize = 64;
  src.connect(micAnalyser);
  micLevelWrap.classList.add('active');
  const buf = new Uint8Array(micAnalyser.frequencyBinCount);
  (function draw(){
    micAnalyser.getByteFrequencyData(buf);
    micBars.forEach((b,i)=>{ b.style.height=Math.max(3,(buf[i*2]/255)*22)+'px'; });
    micRafId = requestAnimationFrame(draw);
  })();
}
function stopMicViz(){
  if(micRafId){ cancelAnimationFrame(micRafId); micRafId=null; }
  micBars.forEach(b=>b.style.height='4px');
  micLevelWrap.classList.remove('active');
}

// ══════════════════════════════════════════════════════
//  UI HELPERS
// ══════════════════════════════════════════════════════
function setAgentState(cls,label){
  agentOrb.className       = cls;
  agentStateText.className = cls;
  agentStateText.textContent = label;
}
function setConnStatus(cls,label){
  connDot.className    = cls;
  connText.textContent = label;
}
function appendTurn(role, text, partial=false){
  const es = document.getElementById('empty-state');
  if(es) es.remove();
  const div = document.createElement('div');
  div.className = `turn ${role}${partial?' partial':''}`;
  const av  = document.createElement('div');
  av.className   = 'avatar';
  av.textContent = role==='user'?'👤':'🤖';
  const bub = document.createElement('div');
  bub.className   = 'bubble';
  bub.textContent = text;
  div.appendChild(av);
  div.appendChild(bub);
  transcriptArea.appendChild(div);
  transcriptArea.scrollTop = transcriptArea.scrollHeight;
}
function addSysMsg(text){
  const d=document.createElement('div');
  d.className='sys-msg'; d.textContent=text;
  transcriptArea.appendChild(d);
  transcriptArea.scrollTop=transcriptArea.scrollHeight;
}
function isAgent(p){
  const id=(p.identity||'').toLowerCase();
  return id.includes('agent')||id.startsWith('lk-agent')||p.isAgent===true;
}

// ══════════════════════════════════════════════════════
//  EVENT LISTENERS
// ══════════════════════════════════════════════════════
callBtn.addEventListener('click',()=>{
  if(!isConnected) startCall(); else endCall();
});

muteBtn.addEventListener('click',()=>{
  if(!room) return;
  isMuted=!isMuted;
  room.localParticipant.setMicrophoneEnabled(!isMuted);
  muteBtn.textContent = isMuted?'🔇':'🎤';
  muteBtn.classList.toggle('muted',isMuted);
  callHint.textContent = isMuted?'Microphone muted':'Speak naturally — no buttons needed';
  toast(isMuted?'🔇 Muted':'🎤 Unmuted','info',1500);
});

volSlider.addEventListener('input',()=>{
  agentAudio.volume = parseFloat(volSlider.value);
  volLabel.textContent = Math.round(volSlider.value*100)+'%';
});

// Unlock audio context on first click (browser autoplay policy)
document.addEventListener('click',()=>{
  if(agentAudio.paused && agentAudio.srcObject){
    agentAudio.play().catch(()=>{});
  }
},{once:true});
</script>
</body>
</html>
